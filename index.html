<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مصدر | سندات التسليم</title>
  <meta name="description" content="MASDAR - Delivery Notes management system">
  <meta name="theme-color" content="#00A8E0">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/splash.css">
</head>
<body>
  <!-- Intro / splash: ring drawn as vector, wordmark revealed from the original logo -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash__stage">
      <svg class="splash__logo" viewBox="0 0 764 327" role="img" aria-label="MASDAR">
        <defs>
          <clipPath id="splash-wordmark"><rect x="0" y="0" width="422" height="327"/></clipPath>
          <mask id="splash-wipe" maskUnits="userSpaceOnUse" x="0" y="0" width="764" height="327">
            <rect class="splash__wipe" x="0" y="0" width="422" height="327" fill="#fff"/>
          </mask>
        </defs>
        <g clip-path="url(#splash-wordmark)" mask="url(#splash-wipe)">
          <image href="assets/images/logo.jpg" x="0" y="0" width="764" height="327" preserveAspectRatio="none"/>
        </g>
        <circle class="splash__ring-glow" cx="599.5" cy="163" r="136" fill="none" stroke="#00A8E0" stroke-width="52"/>
        <circle class="splash__ring" cx="599.5" cy="163" r="136" fill="none" stroke="#00A8E0" stroke-width="52"
                transform="rotate(-90 599.5 163)"/>
      </svg>
      <div class="splash__caption">
        <span class="splash__title">Delivery Notes</span>
        <span class="splash__bar"><i></i></span>
      </div>
    </div>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="MASDAR">
        <img src="assets/images/logo.jpg" alt="MASDAR - مصدر لتجارة الإسمنت والمواد الإنشائية" width="764" height="327">
      </a>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <div class="sidebar__foot">
        <button id="lang-toggle" class="btn btn--soft btn--sm" type="button"></button>
        <small class="sidebar__note" data-i18n="app.sub"></small>
      </div>
      <span class="sidebar__ring" aria-hidden="true"></span>
    </aside>

    <header class="topbar">
      <a class="topbar__brand" href="#/"><img src="assets/images/logo.jpg" alt="MASDAR" width="764" height="327"></a>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Main"></nav>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Libraries (bundled locally, works offline) -->
  <script src="js/vendor/pdf-lib.min.js"></script>
  <script src="js/vendor/fontkit.umd.min.js"></script>
  <script src="js/generated/embedded-assets.js"></script>
  <!-- Core (no DOM) -->
  <script src="js/core/format.js"></script>
  <script src="js/core/delivery-notes.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/arabic-shaper.js"></script>
  <script src="js/core/pdf-generator.js"></script>
  <!-- UI -->
  <script src="js/ui/i18n.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/new-note.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/pages/note-view.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
